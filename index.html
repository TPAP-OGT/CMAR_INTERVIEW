<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0060a7">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>Video Library</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0060a7;
    --ink: #ffffff;
    --muted: #ffffff;
    --line: rgba(255, 255, 255, 0.4);
    --accent: #ffffff;
    --frame: #00203a;
    --focus: #ffffff;
    --font: "Schibsted Grotesk", system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font);
    font-size: 1.0625rem;
    line-height: 1.55;
    padding: 0 0 env(safe-area-inset-bottom, 0px);
  }

  .masthead {
    background: var(--bg);
    padding: calc(1.25rem + env(safe-area-inset-top, 0px)) 1.25rem 1.25rem;
  }
  .masthead img {
    display: block;
    width: 100%;
    max-width: 60rem;
    height: auto;
    margin: 0 auto;
  }

  .masthead img.partners {
    width: 85%;
    max-width: 34rem;
    margin-top: 1.75rem;
  }

  .wrap {
    width: 100%;
    max-width: 52rem;
    margin: 0 auto;
    padding: 0 1.25rem;
  }

  header { padding: 2.5rem 0 2rem; }
  h1 {
    margin: 0;
    font-size: clamp(1.4rem, 6vw, 2rem);
    line-height: 1.15;
    font-weight: 800;
    letter-spacing: -0.005em;
    white-space: pre-line;
    text-wrap: balance;
  }
  h1 .title-light {
    display: block;
    margin-top: 0.4em;
    font-size: 0.9em;
    font-weight: 400;
  }

  .intro {
    margin: 1rem 0 0;
    max-width: 38rem;
    color: var(--muted);
    font-size: 1.1875rem;
    text-wrap: pretty;
  }

  .video {
    padding: 2.25rem 0 2.5rem;
    border-top: 1px solid var(--line);
  }
  .video h2 {
    margin: 0 0 0.375rem;
    font-size: clamp(1.375rem, 4vw, 1.75rem);
    line-height: 1.2;
    font-weight: 700;
    letter-spacing: -0.02em;
  }
  .video p {
    margin: 0 0 1.125rem;
    max-width: 40rem;
    color: var(--muted);
  }

  .frame {
    position: relative;
    width: 100%;
    aspect-ratio: 16 / 9;
    background: var(--frame);
    border-radius: 12px;
    overflow: hidden;
  }
  .frame iframe,
  .frame video {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    border: 0;
    background: var(--frame);
  }
  .frame.empty {
    display: grid;
    place-items: center;
    padding: 1.5rem;
    text-align: center;
    color: #ffffff;
    font-size: 0.975rem;
    border: 1px dashed rgba(255, 255, 255, 0.6);
  }

  .fallback {
    display: inline-block;
    margin-top: 0.875rem;
    color: var(--accent);
    font-weight: 500;
    font-size: 0.975rem;
    text-underline-offset: 3px;
  }
  a:focus-visible {
    outline: 3px solid var(--focus);
    outline-offset: 3px;
    border-radius: 4px;
  }

  footer {
    padding: 2rem 0 3rem;
    border-top: 1px solid var(--line);
    color: var(--muted);
    font-size: 0.9375rem;
  }
  footer:empty { display: none; }
</style>
</head>

    };
  }

  // Vimeo: vimeo.com/ID, vimeo.com/ID/HASH (unlisted), player.vimeo.com/video/ID(?h=HASH)
  const vm = s.match(/player\.vimeo\.com\/video\/(\d+)(?:\?h=([\w-]+))?/) ||
             s.match(/vimeo\.com\/(\d+)(?:\/([\w-]+))?/);
  if (vm) {
    const id = vm[1], hash = vm[2];
    const q = hash ? ("?h=" + hash) : "";
    return {
      kind: "iframe",
      embed: "https://player.vimeo.com/video/" + id + q,
      watch: "https://vimeo.com/" + id + (hash ? "/" + hash : ""),
      where: "Vimeo"
    };
  }

  // YouTube: youtu.be/ID, youtube.com/watch?v=ID, /embed/ID, /shorts/ID, /live/ID
  const yt = s.match(/youtu\.be\/([\w-]{11})/) ||
             s.match(/[?&]v=([\w-]{11})/) ||
             s.match(/youtube(?:-nocookie)?\.com\/(?:embed|shorts|live|v)\/([\w-]{11})/);
  if (yt) {
    return {
      kind: "iframe",
      embed: "https://www.youtube-nocookie.com/embed/" + yt[1] + "?rel=0&playsinline=1",
      watch: "https://www.youtube.com/watch?v=" + yt[1],
      where: "YouTube"
    };
  }

  // Google Drive
  const dr = s.match(/drive\.google\.com\/file\/d\/([\w-]{10,})/) || s.match(/[?&]id=([\w-]{10,})/);
  if (dr) {
    return {
      kind: "iframe",
      embed: "https://drive.google.com/file/d/" + dr[1] + "/preview",
      watch: "https://drive.google.com/file/d/" + dr[1] + "/view",
      where: "Google Drive"
    };
  }
  return null;
}

function el(tag, props, children) {
  const node = document.createElement(tag);
  Object.assign(node, props || {});
  (children || []).forEach(c => node.appendChild(c));
  return node;
}

document.title = SITE.title.replace(/\s*\n\s*/g, " ");
const titleEl = document.getElementById("site-title");
const titleLines = SITE.title.split("\n");
titleLines.forEach((line, i) => {
  if (i > 0) titleEl.appendChild(document.createTextNode("\n"));
  titleEl.appendChild(el(i === titleLines.length - 1 ? "span" : "span", {
    textContent: line,
    className: i === titleLines.length - 1 ? "title-light" : ""
  }));
});
if (SITE.intro) {
  const introEl = document.getElementById("site-intro");
  introEl.textContent = SITE.intro;
  introEl.hidden = false;
}
document.getElementById("site-footer").textContent = SITE.footer || "";

const list = document.getElementById("videos");

VIDEOS.forEach((v, i) => {
  const vid = parseVideo(v.link);
  const article = el("article", { className: "video" });

  article.appendChild(el("h2", { textContent: v.title }));
  if (v.description) article.appendChild(el("p", { textContent: v.description }));

  if (vid) {
    const frame = el("div", { className: "frame" });

    if (vid.kind === "video") {
      const video = el("video", {
        src: vid.src,
        controls: true,
        preload: i === 0 ? "metadata" : "none",
        playsInline: true
      });
      frame.appendChild(video);
    } else {
      const iframe = el("iframe", {
        src: vid.embed,
        title: v.title,
        loading: i === 0 ? "eager" : "lazy",
        allowFullscreen: true
      });
      iframe.setAttribute("allow", "accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share; fullscreen");
      iframe.setAttribute("referrerpolicy", "strict-origin-when-cross-origin");
      frame.appendChild(iframe);
    }

    article.appendChild(frame);

    article.appendChild(el("a", {
      className: "fallback",
      href: vid.watch,
      target: "_blank",
      rel: "noopener noreferrer",
      textContent: "Video not playing? Watch it on " + vid.where
    }));
  } else {
    article.appendChild(el("div", {
      className: "frame empty",
      textContent: "Paste a YouTube link for this video in the VIDEOS list."
    }));
  }

  list.appendChild(article);
});
</script>
</body>
</html>
